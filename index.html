function newGame(df){const d=DF[df],g={df,r:d.r,c:d.c,n:d.n,m:null,st:new Uint8Array(d.r*d.c),t:0,o:0,over:0,hit:-1,fm:false,h:3,gen:0};nbs(g);G=g;save();build()}
/*S*/
function enumC(cells,cs){const n=cells.length,as=new Int8Array(n),cm=cs.map(()=>0),cr=cs.map(c=>c.l.length),cc=cells.map(()=>[]);cs.forEach((c,q)=>c.l.forEach(x=>cc[x].push(q)));
 const feas=new Uint8Array(n+1),M=cells.map(()=>new Uint8Array(n+1)),S=cells.map(()=>new Uint8Array(n+1));let nodes=0,ok=1,cnt=0;
 const rec=i=>{if(!ok)return;if(++nodes>20000){ok=0;return}
  if(i==n){feas[cnt]=1;for(let x=0;x<n;x++)(as[x]?M:S)[x][cnt]=1;return}
  for(const v of[0,1]){as[i]=v;let good=1;for(const q of cc[i]){cr[q]--;cm[q]+=v;if(cm[q]>cs[q].need||cm[q]+cr[q]<cs[q].need)good=0}
   if(good){cnt+=v;rec(i+1);cnt-=v}for(const q of cc[i]){cr[q]++;cm[q]-=v}}}
 rec(0);return ok?{feas,M,S}:null}
function enumd(g,s){const R=g.r*g.c;let mk=0;for(let i=0;i<R;i++)if(s[i]==2)mk++;const rem=g.n-mk,cons=[],par=new Map();
 const find=x=>{while(par.get(x)!==x){par.set(x,par.get(par.get(x)));x=par.get(x)}return x};
 for(let i=0;i<R;i++){if(s[i]!=1||!g.a[i])continue;const cs=[];let k=0;for(const j of g.nb[i])s[j]==0?cs.push(j):s[j]==2&&k++;if(!cs.length)continue;cons.push({cs,need:g.a[i]-k});for(const j of cs)if(!par.has(j))par.set(j,j);const a=find(cs[0]);for(const j of cs){const b=find(j);if(b!==a)par.set(b,a)}}
 const comps=new Map();for(const c of cons){const r=find(c.cs[0]);if(!comps.has(r))comps.set(r,{cells:[],cons:[]});const o=comps.get(r);o.cons.push(c);for(const j of c.cs)if(!o.cells.includes(j))o.cells.push(j)}
 const cp=[];for(const o of comps.values()){const idx=new Map(o.cells.map((x,i)=>[x,i])),e=enumC(o.cells,o.cons.map(c=>({l:c.cs.map(x=>idx.get(x)),need:c.need})));if(!e)return null;cp.push({cells:o.cells,e})}
 const un=[];for(let i=0;i<R;i++)if(s[i]==0&&!par.has(i))un.push(i);const uN=un.length;
 const reach=ex=>{let a=new Uint8Array(rem+1);a[0]=1;cp.forEach((c,i)=>{if(i==ex)return;const b=new Uint8Array(rem+1);for(let x=0;x<=rem;x++)if(a[x])c.e.feas.forEach((f,k)=>{if(f&&x+k<=rem)b[x+k]=1});a=b});return a};
 const can=(a,m,lo,hi)=>{for(let x=0;x<=rem;x++)if(a[x]){const y=rem-m-x;if(y>=lo&&y<=hi)return 1}return 0};
 const safe=[],mine=[];
 cp.forEach((c,i)=>{const a=reach(i);c.cells.forEach((cell,x)=>{let cm=0,cs=0;for(let k=0;k<c.e.feas.length;k++){if(c.e.M[x][k]&&can(a,k,0,uN))cm=1;if(c.e.S[x][k]&&can(a,k,0,uN))cs=1}if(!cm)safe.push(cell);else if(!cs)mine.push(cell)})});
 if(uN){const a=reach(-1);if(!can(a,0,1,uN))safe.push(...un);else if(!can(a,0,0,uN-1))mine.push(...un)}
 return safe.length||mine.length?{safe,mine}:null}
function deduce(g,s){const R=g.r*g.c,sf=new Set(),mn=new Set();
 for(let i=0;i<R;i++){if(s[i]!=1||!g.a[i])continue;let u=0,k=0;for(const j of g.nb[i])s[j]==0?u++:s[j]==2&&k++;if(!u)continue;const nd=g.a[i]-k;if(nd==0)g.nb[i].forEach(j=>s[j]==0&&sf.add(j));else if(nd==u)g.nb[i].forEach(j=>s[j]==0&&mn.add(j))}
 return sf.size||mn.size?{safe:[...sf],mine:[...mn]}:enumd(g,s)}
function solvable(g,f){const s=new Uint8Array(g.r*g.c);let left=g.r*g.c-g.n;const op=i=>{const q=[i];s[i]=1;left--;for(let h=0;h<q.length;h++){const x=q[h];if(!g.a[x])for(const y of g.nb[x])if(!s[y]){s[y]=1;left--;q.push(y)}}};
 op(f);while(left>0){const d=deduce(g,s);if(!d)return false;for(const i of d.mine)s[i]=2;for(const i of d.safe)if(!s[i])op(i)}return true}
function gen(f,done){const g=G,tot=g.r*g.c,ex=new Set([f,...g.nb[f]]),pool=[...Array(tot).keys()].filter(i=>!ex.has(i));
 const step=()=>{if(G!==g)return;const T=performance.now();while(performance.now()-T<18){const p=pool.slice();for(let i=0;i<g.n;i++){const j=i+Math.random()*(p.length-i)|0;[p[i],p[j]]=[p[j],p[i]]}
  g.m=new Uint8Array(tot);for(let i=0;i<g.n;i++)g.m[p[i]]=1;adj(g);if(solvable(g,f)){done();return}}g.m=null;setTimeout(step,0)};step()}
/*E*/
/* 棋盘 */
const B=$('#board'),vib=n=>{if(PF.vb&&navigator.vibrate)try{navigator.vibrate(n)}catch(e){}};
function layout(){if(!G)return;const W=Math.min(innerWidth-32,460),bw=Math.max(200,Math.min(W,(innerHeight-290)*G.c/G.r)),g=G.c>12?2:3,s=document.documentElement.style;
 s.setProperty('--bw',bw+'px');s.setProperty('--g',g+'px');s.setProperty('--cs',(bw-g*(G.c-1))/G.c+'px')}
function build(){B.style.gridTemplateColumns='repeat('+G.c+',1fr)';B.innerHTML=Array.from({length:G.r*G.c},(_,i)=>'<div class="k" data-i="'+i+'"></div>').join('');layout();for(let i=0;i<G.st.length;i++)paint(i);head();ui2()}
function paint(i){const e=B.children[i],s=G.st[i],lost=G.over==2;let c='k',h='';
 if(s==1){c+=' o';const a=G.a[i];if(a)h='<span style="color:var(--n'+a+')">'+a+'</span>'}
 else if(s==2){if(lost&&!G.m[i]){c+=' w';h='<svg class="i"><use href="#flag"/></svg>'}else h='<svg class="i"><use href="#flag"/></svg>'}
 else if(lost&&G.m[i]){c+=' o m'+(i==G.hit?' hit':'');h='<svg class="i mn"><use href="#mine"/></svg>'}
 if(e.className!==c)e.className=c;if(e._h!==h){e.innerHTML=h;e._h=h}}
function head(){const f=G.st.reduce((s,x)=>s+(x==2),0);$('#mc').innerHTML='<svg class="i"><use href="#flag"/></svg>'+(G.n-f);$('#tm').textContent=fmt(G.t);$('#tm').style.visibility=PF.tm?'':'hidden'}
function ui2(){seg($('#mseg'),[t('mo'),t('mf')],G.fm?1:0,k=>{G.fm=k==1;ui2()});$('#ht').style.display=PF.hint?'':'none';$('#hc').textContent=G.h}
function act(i,kind){if(!G||G.over||G.gen)return;const s=G.st[i],op=(kind=='tap')!==G.fm?'open':'flag';
 if(op=='flag'){if(s==1)return chord(i);G.st[i]=s==2?0:2;paint(i);head();vib(8);save();return}
 if(s==2)return;if(s==1)return PF.ch?chord(i):0;
 if(!G.m){G.gen=1;B.style.opacity=.5;gen(i,()=>{G.gen=0;B.style.opacity='';G.o=1;reveal([i])});return}G.o=G.o||1;reveal([i])}
function chord(i){const a=G.a&&G.a[i];if(!a)return;const l=G.nb[i];if(l.filter(j=>G.st[j]==2).length!==a)return;const z=l.filter(j=>G.st[j]==0);if(z.length)reveal(z)}
function reveal(starts){let hit=-1,op=[];const q=[];for(const s of starts){if(G.st[s])continue;if(G.m[s]){hit=s;continue}G.st[s]=1;q.push(s);op.push([s,0])}
 let h=0;const dep=new Map(op);while(h<q.length){const x=q[h++],d=dep.get(x);if(!G.a[x])for(const y of G.nb[x])if(!G.st[y]){G.st[y]=1;dep.set(y,d+1);q.push(y);op.push([y,d+1])}}
 if(hit>=0){G.over=2;G.hit=hit;G.st[hit]=0;for(let i=0;i<G.st.length;i++)paint(i);vib([30,40,60]);end();return}
 op.forEach(([i,d])=>{paint(i);const e=B.children[i];e.style.setProperty('--d',Math.min(d*18,360)+'ms');e.classList.add('pp');setTimeout(()=>e.classList.remove('pp'),900)});
 vib(6);head();if(G.st.reduce((s,x)=>s+(x==1),0)==G.r*G.c-G.n){G.over=1;for(let i=0;i<G.st.length;i++)if(G.m[i])G.st[i]=2;head();wave();end()}else save()}
function wave(){for(let i=0;i<G.st.length;i++){paint(i);const e=B.children[i];e.style.setProperty('--d',((i/G.c|0)+i%G.c)*22+'ms');e.classList.add('wv');setTimeout(()=>e.classList.remove('wv'),1400)}}
function end(){tick.on=0;let nr=0;
 if(G.over==1){ST.w[G.df]++;if(!ST.bm[G.df]||G.t<ST.bm[G.df]){nr=ST.bm[G.df]>0;ST.bm[G.df]=G.t}}
 save();stats();const w=G.over==1;
 setTimeout(()=>dlg(t(w?'win':'lose'),w?t('time',fmt(G.t),nr):'',w?[[t('home'),()=>go('home',-1)],[t('again'),()=>newGame(G.df),1]]:[[t('view'),0],[t('again'),()=>newGame(G.df),1]]),w?900:700)}
/* 输入：轻点 / 长按 / 右键 */
let lp=0,fired=0,pi=-1,px=0,py=0;
B.addEventListener('pointerdown',e=>{const c=e.target.closest('.k');if(!c)return;pi=+c.dataset.i;px=e.clientX;py=e.clientY;fired=0;clearTimeout(lp);
 if(e.button==2){fired=1;act(pi,'long');return}lp=setTimeout(()=>{fired=1;act(pi,'long')},360)});
B.addEventListener('pointermove',e=>{if(pi>=0&&Math.hypot(e.clientX-px,e.clientY-py)>10){clearTimeout(lp);pi=-1}});
B.addEventListener('pointerup',()=>{clearTimeout(lp);if(pi>=0&&!fired)act(pi,'tap');pi=-1});
B.addEventListener('pointercancel',()=>{clearTimeout(lp);pi=-1});
B.addEventListener('contextmenu',e=>e.preventDefault());
$('#ht').onclick=()=>{if(!G||G.over||G.gen)return;if(!G.m)return toast(t('hfirst'));if(G.h<1)return toast(t('hout'));
 const d=deduce(G,Uint8Array.from(G.st,x=>x==1?1:0)),i=d&&(d.safe.length?d.safe[0]:d.mine[0]);if(i==null)return toast(t('hnone'));
 G.h--;ui2();save();const e=B.children[i],k=d.safe.length?'hs':'hm';e.classList.add(k);setTimeout(()=>e.classList.remove(k),3000)};
let tt=0;function toast(x){const e=$('#toast');e.textContent=x;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),1800)}
function tick(){if(tick.on)return;tick.on=1;const f=()=>{if(!tick.on||!G||G.over||!$('#game').classList.contains('on')){tick.on=0;return}if(!document.hidden&&G.m){G.t++;$('#tm').textContent=fmt(G.t)}setTimeout(f,1000)};setTimeout(f,1000)}
/* 对话框与页面切换 */
function openM(el){el.getAnimations({subtree:true}).forEach(a=>a.cancel());el.classList.add('on');const b=el.querySelector('.box'),s=el.id=='sheet';el.animate([{opacity:0},{opacity:1}],{duration:250});b.animate(s?[{transform:'translateY(100%)'},{transform:'none'}]:[{opacity:0,transform:'scale(1.1)'},{opacity:1,transform:'none'}],{duration:s?480:380,easing:EZ})}
function closeM(el){const b=el.querySelector('.box'),o={duration:260,easing:EZ,fill:'both'};el.animate([{opacity:1},{opacity:0}],o);return b.animate(el.id=='sheet'?[{transform:'none'},{transform:'translateY(100%)'}]:[{opacity:1,transform:'none'},{opacity:0,transform:'scale(.95)'}],o).finished.then(()=>{el.getAnimations({subtree:true}).forEach(a=>a.cancel());el.classList.remove('on')}).catch(()=>el.classList.remove('on'))}
function dlg(h,p,bs){$('#ot').textContent=h;$('#op').textContent=p;$('#op').style.display=p?'':'none';$('#ob').innerHTML='';
 bs.forEach(([x,fn,pr])=>{const b=document.createElement('button');b.textContent=x;if(pr)b.className='b';b.onclick=()=>{closeM($('#ov')).then(()=>fn&&fn())};$('#ob').append(b)});openM($('#ov'))}
function go(id,dir){const cur=document.querySelector('.scr.on'),nx=$('#'+id);if(cur===nx)return;
 const clean=()=>{document.querySelectorAll('.scr').forEach(e=>{e.getAnimations().forEach(a=>a.cancel());e.classList.remove('tr');e.style.cssText='';if(e!==nx)e.classList.remove('on')});nx.classList.add('on')};
 if(!cur||matchMedia('(prefers-reduced-motion:reduce)').matches){clean();return}
 const f=dir>0,o={duration:480,easing:EZ,fill:'both'};cur.classList.add('tr');nx.classList.add('on','tr');nx.style.zIndex=f?2:1;cur.style.zIndex=f?1:2;window.scrollTo(0,0);
 nx.animate(f?[{transform:'translateX(100%)'},{transform:'none'}]:[{transform:'translateX(-28%)'},{transform:'none'}],o);
 cur.animate(f?[{transform:'none'},{transform:'translateX(-28%)'}]:[{transform:'none'},{transform:'translateX(100%)'}],o).finished.then(clean).catch(clean)}
/* 首页与设置 */
function seg(el,items,cur,fn){let th=el.querySelector('.th');if(!th||el._n!=items.length){el.innerHTML='<i class="th"></i>'+items.map((_,i)=>'<button data-k="'+i+'"></button>').join('');th=el.querySelector('.th');el._n=items.length;el.querySelectorAll('button').forEach(b=>b.onclick=()=>fn(+b.dataset.k))}
 th.style.width='calc((100% - 6px)/'+items.length+')';th.style.transform='translateX('+cur*100+'%)';el.querySelectorAll('button').forEach((b,j)=>{b.textContent=items[j];b.classList.toggle('on',j==cur)})}
function stats(){$('#recs').innerHTML=[0,1,2].map(d=>'<div class="row"><span>'+t('df')[d]+'</span><small>'+(ST.bm[d]?fmt(ST.bm[d])+' · ':'')+t('w',ST.w[d])+'</small></div>').join('')}
function home(){const c=G&&G.o&&!G.over;$('#cg').style.display=c?'':'none';if(c)$('#cinfo').textContent=t('df')[G.df]+(PF.tm?' · '+fmt(G.t):'');
 $('#levels').innerHTML=DF.map((d,i)=>'<button class="row" data-d="'+i+'"><span>'+t('df')[i]+'</span><small>'+d.c+'×'+d.r+' · '+t('m',d.n)+'<svg class="i s"><use href="#chev"/></svg></small></button>').join('');
 $('#levels').querySelectorAll('.row').forEach(b=>b.onclick=()=>start(+b.dataset.d))}
function start(d){const run=()=>{newGame(d);go('game',1);tick()};if(G&&G.o&&!G.over)dlg(t('newq'),t('newd'),[[t('cancel'),0],[t('start'),run,1]]);else run()}
function sw(id,k){const e=$(id);e.classList.toggle('on',!!PF[k]);e.setAttribute('aria-checked',!!PF[k]);e.onclick=()=>{PF[k]=!PF[k];prefs()}}
function ui(){seg($('#seg'),t('ap'),PF.ap,k=>{PF.ap=k;prefs()});seg($('#lseg'),['简体中文','English'],PF.lang=='en'?1:0,k=>{PF.lang=k?'en':'zh';prefs()});
 const el=$('#pal');if(!el.children.length){el.innerHTML=P.map((q,i)=>'<button data-i="'+i+'"><span class="dots">'+q.c.map(c=>'<i style="background:'+c+'"></i>').join('')+'</span><em style="font-style:normal"></em></button>').join('');el.querySelectorAll('button').forEach(b=>b.onclick=()=>{PF.pal=+b.dataset.i;prefs()})}
 el.querySelectorAll('button').forEach((b,i)=>{b.classList.toggle('on',PF.pal==i);b.querySelector('em').textContent=PF.lang=='en'?P[i].e:P[i].n});
 sw('#tmsw','tm');sw('#chsw','ch');sw('#vbsw','vb');sw('#htsw','hint');stats()}
function applyLang(){$('#ta').placeholder=t('ph');document.documentElement.lang=PF.lang=='en'?'en':'zh-CN';document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t(e.dataset.t))}
function prefs(){try{localStorage.setItem(PK,JSON.stringify(PF))}catch(e){}theme();applyLang();ui();home();if(G){head();ui2()}}
$('#set2').onclick=()=>openM($('#sheet'));$('#sx').onclick=()=>closeM($('#sheet'));$('#sheet').onclick=e=>{if(e.target.id=='sheet')closeM($('#sheet'))};
const ta=$('#ta'),msg=x=>$('#msg').textContent=x;
$('#ex').onclick=()=>{const c=btoa(JSON.stringify({v:1,st:ST,g:gs()}));ta.value=c;ta.select();(navigator.clipboard?navigator.clipboard.writeText(c).then(()=>msg(t('cp'))):Promise.reject()).catch(()=>msg(t('cp2')))};
$('#im').onclick=()=>{const v=ta.value.trim();if(!v){msg(t('paste'));ta.focus();return}
 try{const o=JSON.parse(atob(v)),ok=a=>Array.isArray(a)&&a.length==3&&a.every(Number.isFinite);if(o.v!==1||!ok(o.st.w)||!ok(o.st.bm))throw 0;let g=null;const q=o.g;
  if(q){const d=DF[q.df];if(!d||q.r!=d.r||q.c!=d.c||q.st.length!=q.r*q.c||(q.m&&q.m.length!=q.st.length))throw 0;g=hydrate(q)}
  ST={w:o.st.w,bm:o.st.bm};G=g;save();ta.value='';msg(t('okimp'));stats();home()}catch(e){msg(t('bad'))}};
$('#cont').onclick=()=>{build();go('game',1);tick()};
$('#bk').onclick=()=>{save();home();go('home',-1)};
addEventListener('resize',layout);addEventListener('pagehide',save);document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});
theme();applyLang();ui();home();
</script></body></html>
